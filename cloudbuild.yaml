steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/exploding-pigs-server:$COMMIT_SHA', '.']
    dir: 'server'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/exploding-pigs-server:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'exploding-pigs-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/exploding-pigs-server:$COMMIT_SHA'
      - '--region'
      - 'europe-central2'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GAME_SECRET=CzasamiSaTakieDniZeSobieMysleAleToRzadkoXDDDD'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/exploding-pigs-server:$COMMIT_SHA'